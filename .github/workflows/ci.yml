name: CI

on:
  pull_request:
  push:
    branches: [main]

# No publish here — releasing is gated on an owner-created tag (see docs/releasing.md).
permissions:
  contents: read

jobs:
  quality:
    name: check · test · build · pkg · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run check:pkg
      - run: bun run size
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  react18:
    name: React 18 matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:react18

  browser:
    name: Storybook + browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run test:browser

  examples:
    name: Consumer examples build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun link
      - name: Build Vite examples (React 18 + 19)
        run: |
          for app in vite-react19 vite-react18; do
            (cd "examples/$app" && bun install && bun link @sukuna/ui && bun run build)
          done
      - name: Build Next.js App Router example
        run: |
          cd examples/next-app-router
          bun install
          bun link @sukuna/ui
          bun run build
      - name: Hydration smoke (Next SSR, zero hydration warnings)
        run: |
          bunx playwright install --with-deps chromium
          (cd examples/next-app-router && PORT=3111 bun run start &)
          npx --yes wait-on http://localhost:3111 -t 60000
          node scripts/hydration-smoke.mjs http://localhost:3111
