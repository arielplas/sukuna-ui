<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@sukunagg/video — standalone</title>
    <!--
      A deliberately hostile host page: global element rules like an old site or a CSS framework
      ships. The player's scoped reset + prefixed utilities must keep its chrome intact, while the
      app content inside the overlay keeps these host styles.
    -->
    <style>
      * { box-sizing: content-box; }
      body { margin: 24px; font: 18px/1.8 Georgia, serif; color: #222; background: #f3efe6; }
      button { padding: 10px 22px; margin: 4px; border: 3px solid #c00; border-radius: 0;
        background: #0654d6; color: #ff0; font: bold 16px Georgia, serif; }
      ul, ol { padding-left: 2.5em; margin: 1em 0; }
      p { margin: 0 0 1em; }
      a { color: #0000ee; text-decoration: underline; }
      svg { overflow: visible; }
      input, textarea { border: 2px inset #999; padding: 6px; font: 16px Georgia, serif; }
      h1, h2, h3 { font-family: Impact, sans-serif; margin: 0.5em 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
