<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>sukuna-ui — SSR-safe, accessible React components for dark-first products</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B4E"/>
      <stop offset="1" stop-color="#B01221"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#FF3B4E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF3B4E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="72" y="72" width="1056" height="486" rx="24" fill="#141416" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="72" y="72" width="8" height="486" rx="4" fill="url(#accent)"/>
  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
    <text x="128" y="150" font-size="18" font-weight="600" letter-spacing="4" fill="#9A948A">REACT · TAILWIND V4 · SSR-SAFE · WCAG AA</text>
    <text x="128" y="270" font-size="112" font-weight="900" letter-spacing="-4" fill="#F4F1EC">sukuna<tspan fill="url(#accent)">-ui</tspan></text>
    <text x="128" y="345" font-size="38" font-weight="700" letter-spacing="-1" fill="#F4F1EC">React components for dark-first products —</text>
    <text x="128" y="395" font-size="38" font-weight="700" letter-spacing="-1" fill="#F4F1EC">and for the agents that build them.</text>
    <text x="128" y="480" font-size="24" font-weight="400" fill="#9A948A">30 components · one CSS import · llms.txt included</text>
    <text x="128" y="520" font-size="22" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#E8DCC4">bun add sukuna-ui</text>
  </g>
</svg>
